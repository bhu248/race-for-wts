name: Sunday Scoreboard

# Polls the Sleeper API during NFL game windows and republishes
# docs/week<N>.html (served by GitHub Pages) with the latest scores. No
# secrets required — Sleeper's API is public and read-only, and this
# workflow's own GITHUB_TOKEN is enough to commit the results back.
#
# There is deliberately no `schedule:` trigger here anymore. GitHub's own
# cron scheduler was observed missing runs by 15-20+ minutes or more during
# the Week 1 opener, with nothing diagnosable from outside GitHub (workflow
# wasn't disabled, no GitHub status incident, cron was valid) — see
# CLAUDE.md. Scheduling now happens on the local machine instead:
# scripts/local_scheduler.py ticks every 3 minutes via Windows Task
# Scheduler and calls `gh workflow run` (i.e. workflow_dispatch, below)
# whenever it's inside a game window AND due per its own adaptive cadence
# (3min when 2+ NFL games are concurrently live, 6min otherwise — see
# CLAUDE.md). Its window logic is the local equivalent of what used to be
# the cron list here; the windows below are kept as comments purely for
# reference, not as a live schedule.
#
#   Sunday day+night, Monday night, Wednesday night, and Thursday night —
#   2026's Week 1 opener (Sea @ NE, Wed Sept 9) moved the usual Thursday
#   opener to a Wednesday, kept recurring after in case of another
#   schedule-shuffle Wednesday game.
#   Sunday daytime + evening (main slate):     17-23 UTC Sunday
#   Sunday Night Football (after midnight UTC): 0-4 UTC Monday
#   Monday Night Football:                      0-4 UTC Tuesday
#   Wednesday night game:                       0-4 UTC Thursday
#   Thursday Night Football:                    0-4 UTC Friday
#
#   Plus 2026-season-specific Friday/Saturday dates (no year field in the
#   local scheduler's DATE_WINDOWS either — review/remove before the 2027
#   season): Black Friday (Nov 27-28), Christmas Day (Dec 25-26), Week 15
#   Saturday (Dec 19-20), Week 16 Saturday (Dec 26-27), Week 17 Saturday
#   (Jan 2-3), Week 18 Saturday (Jan 9-10, tentative). Source: 2026 NFL
#   schedule as published, checked 2026-09-09.
on:
  workflow_dispatch:
    inputs:
      seed_dummy:
        description: "Seed fake week-0 data (using your real team names) instead of polling live scores — safe to run anytime, for testing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scoreboard-poll
  cancel-in-progress: false

env:
  LEAGUE_ID: "1393377829990727680"

jobs:
  poll-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Poll live scores, or seed dummy data for a test run
        run: |
          if [ "${{ github.event.inputs.seed_dummy }}" = "true" ]; then
            python scripts/seed_dummy_data.py
            python scripts/render.py 0
          else
            python scripts/poll.py
            python scripts/render.py
          fi

      - name: Commit and push if anything changed
        run: |
          git config user.name "race-for-wts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update scoreboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed, pulling and retrying ($attempt/3)..."
            git pull --rebase
          done
          git push
